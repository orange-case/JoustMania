# Per-flag facts the flag files and the registry do not state (flags.md §3 to §10a).
# scripts/gen_specs.py merges them into docs/specs/generated/flag-catalog.md; every
# flag of services/flagd/*.json has exactly one entry (`make specs-check` fails otherwise).
#
# read_by: services that read the flag at runtime ([] = no effective reader)
# reload:  live | event-refreshed | per-game | startup (flags.md §1.3); none when read_by is []
# note:    what the flag means in game or operator terms: units, clamps and fallbacks,
#          fail-closed reads, interactions, spec ids. Not variants, defaults or writers.

agent:
  ai.observe_synthetic:
    read_by: [agent]
    reload: live
    note: >-
      Lets the agent ingest telemetry marked `orangecase.synthetic` (benchmark load, #2576). Off drops
      it before any game context (UC-041 BR-011), the backup for a collector agent route opened by
      mistake; on also needs that route opened in the collector config. Read per batch, only when a
      batch holds a marked item; unresolved reads off. Human-owned, never written by the agent (C-034).
  code_improvement.min_interval_seconds:
    read_by: [agent]
    reload: live
    note: >-
      Minimum time between code-improvement proposals, checked at game end after the `enabled` and
      `experiments_enabled` permit. A value <= 0 counts as the default 300 s.
  code_improvement.mode:
    read_by: [agent]
    reload: live
    note: >-
      What a promotion does: `issue` opens an issue only, `autonomous` applies the change. Read at
      each promotion; never defaults to `autonomous`.
  decision.backend:
    read_by: [agent]
    reload: live
    note: >-
      Which decision backend the agent uses: the local rules or a remote model.
  decision.capture_content:
    read_by: [agent]
    reload: live
    note: >-
      Whether remote decide requests and answers, and the retro's user prompt, are captured in full.
  decision.claude.act_confidence_threshold:
    read_by: [agent]
    reload: live
    note: >-
      Confidence a claude answer needs to act, checked when the answer lands. NaN, a value outside 0
      to 1 or a read error gives 0.8.
  decision.claude.base_url:
    read_by: [agent]
    reload: live
  decision.claude.max_requests_per_minute:
    read_by: [agent]
    reload: live
    note: >-
      Tighten-only cap on claude decide calls inside the shared LLM budget (FR-152, C-034); a value
      above `llm.max_requests_per_minute` does nothing, negative closes the backend, a read error
      gives 30. The retro and proposer are not charged to it.
  decision.claude.model:
    read_by: [agent]
    reload: live
  decision.claude.timeout_ms:
    read_by: [agent]
    reload: live
  decision.jev.act_confidence_threshold:
    read_by: [agent]
    reload: live
    note: >-
      Confidence a jev answer needs to act, checked when the answer lands; the fire-time value is
      also the request's threshold, where jev's own gate opens (decide-contract §3.1). NaN, a value
      outside 0 to 1 or a read error gives 0.6.
  decision.jev.base_url:
    read_by: [agent]
    reload: live
  decision.jev.model:
    read_by: [agent]
    reload: live
  decision.jev.timeout_ms:
    read_by: [agent]
    reload: live
  decision.magnitude_bounds:
    read_by: [agent]
    reload: live
    note: >-
      Per-intervention magnitude ranges for rules and remote decisions, moved only inside the hard
      limits; an invalid entry falls back to that intervention's code default (UC-040 BR-045,
      FR-098). Human-only (C-034).
  decision.max_state_age_ms:
    read_by: [agent]
    reload: live
    note: >-
      A remote answer is discarded as `stale` (detail `state_too_old`) when the game state it was
      asked about is older than this when it lands. Negative gives the default.
  decision.min_gap_after_answer_ms:
    read_by: [agent]
    reload: live
    note: >-
      Minimum time in one game from when the previous remote call returned (answer, timeout or
      failure) to the next one; a call needs this and `decision.min_interval_ms`. Negative gives the
      default.
  decision.min_interval_ms:
    read_by: [agent]
    reload: live
    note: >-
      Minimum time between remote decide calls in one game, from the previous call's admission.
  decision.operator_brief:
    read_by: [agent]
    reload: live
    note: >-
      Free-text operator hint added to claude and jev decide requests and the retro, at most 512 characters
      after cleaning; it steers which offered option the model prefers, never options, ranges or
      caps (UC-040 BR-044, FR-096). Blank = no brief. Human-only (C-034).
  decision.predictions.ask_model:
    read_by: [agent]
    reload: live
    note: >-
      Adds a prediction question to claude and jev decide requests, only while
      `decision.predictions_enabled` is also on. Unreadable reads off.
  decision.predictions_enabled:
    read_by: [agent]
    reload: live
    note: >-
      Registers and scores predictions about intervention outcomes; `off` stops new ones while
      pending ones still score. Unreadable reads on (it only observes).
  decision.probe_decisions:
    read_by: [agent]
    reload: live
    note: >-
      Switches the rules to probe decisions; ignored in pattern games. Unresolved reads false.
  decision.throttle_seconds:
    read_by: [agent]
    reload: live
    note: >-
      Minimum time between decision cycles; reloaded on each flag sync and polled every second as a
      safety net.
  effect.window_seconds:
    read_by: [agent]
    reload: live
    note: >-
      How long after an intervention its effect is measured; non-positive gives the default.
  enabled:
    read_by: [agent, game-coordinator, menu]
    reload: live
    note: >-
      The agent state off / watch / act, booting at watch (off in ci/): off stops every decision,
      promotion, the experiment proposer and the retro model call; watch decides and records but writes
      nothing that changes a game; only act writes, and the coordinator applies only at act. An
      unreadable value, a bool or the old "on" reads off (FR-051, UC-045, UC-016 BR-011).
  experiment.max_game_seconds:
    read_by: [agent]
    reload: per-game
    note: >-
      Longest a shadow game may run, pinned per experiment before its first spawn (FR-111, UC-046
      BR-013).
  experiment.mock_archetype:
    read_by: [agent]
    reload: per-game
    note: >-
      Resolves each name in `experiment.mock_archetypes` via context `archetype`; the returned
      variant must equal the name, and an unknown name is an evaluation error (UC-046 A2). Pinned
      per experiment.
  experiment.mock_archetypes:
    read_by: [agent]
    reload: per-game
    note: >-
      Mock player archetypes for shadow games, pinned per experiment at its first allocation and
      kept on rehydrate; a one-shot runner uses the first unless `SHADOW_GAME_ARCHETYPE` is set
      (FR-105, FR-106, UC-046). A comma-separated string because flagd rejects array variants;
      `burst_holder` is left out of `all` and selected by name only, so running experiments do
      not change.
  experiment_completed_grace_seconds:
    read_by: [agent]
    reload: live
    note: >-
      Backstop after a shadow game completes; `0` disables it. Also bounds how long a shadow game
      waits for the runner's outcome, at least 18 s (UC-046 BR-016). Unresolved gives 60.
  experiment_dynamic_candidates:
    read_by: [agent]
    reload: live
    note: >-
      Comma-separated entries the dynamic declarer rotates over in order (trimmed, deduplicated,
      case-sensitive; unknown keys skipped). An entry is a `game` flag key (the declarer tries the
      variant next to the baseline default) or `flag=variant`, an explicit operator candidate that is
      skipped while the variant is missing or equals the baseline default (UC-043 BR-012). Empty =
      every tunable flag; the denylists still apply (UC-070 BR-008).
  experiment_dynamic_denylist:
    read_by: [agent]
    reload: live
    note: >-
      Comma-separated `game` flag keys added to the built-in denylist; it can only tighten, never
      remove a built-in key, and empty or unresolved means the built-in list alone (UC-070 BR-008,
      C-034).
  experiment_dynamic_enabled:
    read_by: [agent]
    reload: live
    note: >-
      Lets the agent declare experiments on its own each tick; the plumbing, lobby and ceremony
      flags are never candidates (UC-070 BR-008). An unresolved flag reads false (fails closed,
      UC-045 A3).
  experiment_dynamic_max_concurrent:
    read_by: [agent]
    reload: live
    note: >-
      Most concurrent dynamic and proposed experiments; effective value is the lower of this and the
      `AGENT_EXPERIMENT_DYNAMIC_MAX_CONCURRENT` env ceiling, clamped to shadow capacity (C-034,
      FR-152). Non-positive or unresolved gives 3.
  experiment_dynamic_objective:
    read_by: [agent]
    reload: live
    note: >-
      Objective of a dynamically declared experiment when no fitness-pressure signal picks one;
      empty, unknown, `chaos` or unresolved gives `balanced` (UC-043).
  experiment_proposer_enabled:
    read_by: [agent]
    reload: live
    note: >-
      The proposers run only when `AGENT_EXPERIMENT_PROPOSER_ENABLED=true` and this flag is on
      (C-034, FR-152); a missing flag or lost sync reads false (fails closed).
  experiment_shadow_effective_concurrency:
    read_by: [agent]
    reload: live
    note: >-
      Shadow games the experiment registry runs at once; at least 2 lets both arms of a pair start
      in one tick. Clamped to the registry ceiling; a coordinator at capacity makes the registry
      retry next tick.
  experiment_tick_seconds:
    read_by: [agent]
    reload: live
    note: >-
      Seconds between experiment-loop ticks; the first tick comes after at most 5 s. Unresolved
      gives 30.
  experiments_enabled:
    read_by: [agent]
    reload: live
    note: >-
      Gates experiment allocation and the experiment proposer; an unresolved flag reads false (fails
      closed, UC-045 A3).
  fitness.accelerate.target_session_seconds:
    read_by: [agent]
    reload: live
    note: >-
      Accelerate fitness target used by the rules each decision cycle and by the experiment loop's
      fitness scoring at each game end.
  fitness.balanced.max_skill_gap:
    read_by: [agent]
    reload: live
    note: >-
      Balanced fitness threshold used by the rules each decision cycle and by the experiment loop's
      fitness scoring at each game end.
  fitness.balanced.spike_survival_threshold:
    read_by: [agent]
    reload: live
    note: >-
      Balanced fitness threshold used by the rules each decision cycle and by the experiment loop's
      fitness scoring at each game end.
  fitness.endurance.min_session_seconds:
    read_by: [agent]
    reload: live
    note: >-
      Endurance fitness threshold used by the rules each decision cycle and by the experiment loop's
      fitness scoring at each game end.
  goal.profile:
    read_by: [agent]
    reload: live
    note: >-
      Named goal profile used for the goal lines in remote requests and scored at game end (UC-054);
      an invalid or unreadable value falls back to `from_objectives`.
  inference.backend:
    read_by: [agent]
    reload: live
    note: >-
      Text backend for the retro and the proposer; `claude` takes effect only with an API key and a
      valid `AGENT_INFERENCE_BASE_URL`, otherwise the stub serves. Unresolved gives `stub`.
  inference.effort:
    read_by: [agent]
    reload: live
    note: >-
      Effort level of the retro and proposer text backend; an unknown level sends none.
  inference.model:
    read_by: [agent]
    reload: live
    note: >-
      Model of the retro and proposer text backend; unresolved gives the compiled default.
  inference.timeout_seconds:
    read_by: [agent]
    reload: live
    note: >-
      Per-call deadline of the retro and proposer text backend, also the retro deadline;
      non-positive gives the default.
  interventions_allowed:
    read_by: [agent, game-coordinator, menu]
    reload: live
    note: >-
      Which intervention types the agent may use; the coordinator filters by the same list, and the
      operator pad shows it as its agent-level ladder (UC-015 BR-019).
  lifecycle.evict_interval_seconds:
    read_by: [agent]
    reload: live
    note: >-
      How often the agent sweeps expired players and sessions; reloaded on each flag sync and polled
      every second as a safety net.
  lifecycle.player_ttl_seconds:
    read_by: [agent]
    reload: live
    note: >-
      How long the agent keeps a player it no longer hears from; reloaded on each flag sync and
      polled every second as a safety net.
  lifecycle.session_grace_seconds:
    read_by: [agent]
    reload: live
    note: >-
      Grace period before the agent closes an idle session; reloaded on each flag sync and polled
      every second as a safety net.
  llm.eligible_game_kinds:
    read_by: [agent]
    reload: live
    note: >-
      Which game kinds may make remote LLM calls: gates in-game decisions, the retro and the
      proposer. `shadow_only` keeps every real game off the model.
  llm.max_requests_per_minute:
    read_by: [agent]
    reload: live
    note: >-
      One shared per-minute LLM budget for decisions, the retro and the proposer; the enforced cap
      is the lower of this and the `AGENT_LLM_MAX_REQUESTS_PER_MINUTE` env ceiling (C-034). Claude
      decide calls also need a slot under `decision.claude.max_requests_per_minute`. A value <= 0
      means closed: no remote call is admitted.
  objectives:
    read_by: [agent, game-coordinator]
    reload: live
    note: >-
      The objective the agent steers toward; the coordinator also uses the dominant objective when
      evaluating interventions. Lobby-only change from the operator pad (UC-016 BR-012).
  perception.ema_weight:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Smoothing weight of the movement EMA in perception, frozen when a game mode starts.
  perception.playstyle.aggressive_warning_danger_min:
    read_by: [game-coordinator]
    reload: event-refreshed
    note: >-
      Playstyle classifier threshold (aggressive: minimum warning-plus-danger share); applies from
      the next game start.
  perception.playstyle.balanced_still_min:
    read_by: [game-coordinator]
    reload: event-refreshed
    note: >-
      Playstyle classifier threshold (balanced: minimum still share); applies from the next game
      start.
  perception.playstyle.balanced_warning_danger_max:
    read_by: [game-coordinator]
    reload: event-refreshed
    note: >-
      Playstyle classifier threshold (balanced: maximum warning-plus-danger share); applies from the
      next game start.
  perception.playstyle.calm_still_min:
    read_by: [game-coordinator]
    reload: event-refreshed
    note: >-
      Playstyle classifier threshold (calm: minimum still share); applies from the next game start.
  perception.playstyle.calm_warning_danger_max:
    read_by: [game-coordinator]
    reload: event-refreshed
    note: >-
      Playstyle classifier threshold (calm: maximum warning-plus-danger share); applies from the
      next game start.
  perception.zone_active_max:
    read_by: [game-coordinator]
    reload: event-refreshed
    note: >-
      Upper bound of the active movement zone in the coordinator's perception analytics; a change
      applies from the next game start.
  perception.zone_still_max:
    read_by: [game-coordinator]
    reload: event-refreshed
    note: >-
      Upper bound of the still movement zone in the coordinator's perception analytics; a change
      applies from the next game start.
  perception.zone_warning_max:
    read_by: [game-coordinator]
    reload: event-refreshed
    note: >-
      Upper bound of the warning movement zone in the coordinator's perception analytics; a change
      applies from the next game start.
  policy.battery_threshold:
    read_by: [agent, game-coordinator]
    reload: live
    note: >-
      Battery level below which interventions on a controller are blocked, in both the agent and the
      coordinator. The rules engine's objective rules use a static copy and ignore the flag.
  policy.coordinator_backstop_per_minute:
    read_by: [game-coordinator]
    reload: live
    note: >-
      The coordinator's own per-minute backstop on applied interventions, independent of the agent's
      limiter.
  policy.group_grant.enabled:
    read_by: [agent, game-coordinator]
    reload: live
    note: >-
      Master switch of the group shield (UC-048 BR-014); also needs
      `policy.group_grant.max_per_game` of at least 1. A missing or unreadable value reads `off`.
      Human-only (C-034).
  policy.group_grant.max_per_game:
    read_by: [agent, game-coordinator]
    reload: live
    note: >-
      Most group shields per game, clamped to 0 to 3; `0` allows none, so enabling the group shield
      also needs a value of at least 1. A missing or unreadable value reads 0.
  policy.group_grant.max_targets:
    read_by: [agent, game-coordinator]
    reload: live
    note: >-
      Most players one group shield may cover, clamped to 2 to 6. A missing or unreadable value
      turns the group shield off.
  policy.group_grant.real_games:
    read_by: [agent, game-coordinator]
    reload: live
    note: >-
      Allows the group shield in real games; without it only shadow games get one, and a game of
      unknown kind counts as real (UC-048 BR-014). A missing or unreadable value reads `off`.
  policy.max_interventions_per_minute:
    read_by: [agent]
    reload: live
    note: >-
      Weighted rate limit on agent interventions, with rank-order admission and a 1.0 reserve kept
      for nudges (UC-040 BR-014, BR-015). Never written by the agent (C-034).
  policy.max_shields_per_player_per_game:
    read_by: [agent, game-coordinator]
    reload: live
    note: >-
      Most agent shields one player gets per game; the coordinator enforces it, and the agent refuses
      `shield_cap_reached` once the coordinator's `game_player_shield_gate{stat="grants"}` reached
      it (UC-048 A6, A7, BR-007). A read error or negative
      value gives 3; a lower cap applies at once.
  policy.shield_cooldown_seconds:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Seconds after a player's last agent shield ends before another is granted (UC-048 A6, A7,
      BR-007); `0` turns it off and allows extending a running shield. A read error or negative
      value gives 15. The agent refuses `shield_cooldown` from the coordinator's
      `game_player_shield_gate{stat="cooldown_until"}`, which adds the value read at the grant.
  policy.shield_danger_enabled:
    read_by: [agent]
    reload: live
    note: >-
      `off` stops the rules' danger shields before the first elimination without removing
      `grant_shield` from the allow-list; the elimination path is unaffected (decide-contract.md §15.3). A
      missing or unreadable value reads `on`.
  policy.shield_danger_ratio:
    read_by: [agent]
    reload: live
    note: >-
      Fraction of the death threshold that each of the last `policy.shield_danger_samples` movement
      readings must reach for a danger shield before the first elimination (decide-contract.md §15.3).
      Clamped to 0.7 to 1.0; invalid gives 0.85.
  policy.shield_danger_samples:
    read_by: [agent]
    reload: live
    note: >-
      Consecutive movement readings (about one per second) that must reach
      `policy.shield_danger_ratio` before a danger shield. Clamped to 2 to 10, so one reading never
      triggers; invalid gives 3.
  verdict_effect_threshold:
    read_by: [agent]
    reload: live
    note: >-
      Standardized effect size the experimental arm must reach for a verdict. Unresolved gives the
      compiled default.
  verdict_min_pairs:
    read_by: [agent]
    reload: live
    note: >-
      Minimum paired games before an experiment verdict; unresolved gives the compiled default.
  verdict_min_raw_effect:
    read_by: [agent]
    reload: live
    note: >-
      Smallest fitness difference between the arms that counts, on the 0 to 1 fitness scale; smaller
      effects are in the don't-care band. Unresolved gives the compiled default.
  verdict_sd_floor:
    read_by: [agent]
    reload: live
    note: >-
      Floor on the spread in the standardized effect size, so it stays finite when games are
      near-deterministic; it does not replace `verdict_min_raw_effect`. Unresolved gives the
      compiled default.

game:
  countdown_phase_duration_ms:
    read_by: [game-coordinator]
    reload: event-refreshed
    note: >-
      Length of each pre-game countdown phase in ms; `0` skips the countdown.
  death_grace_period_seconds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Seconds at game start in which movement cannot kill; negative or malformed values fall back to
      the default.
  fight_club.min_rounds:
    read_by: [menu]
    reload: per-game
    note: >-
      Minimum number of Fight Club rounds. Only real games read it (UC-043 BR-009).
  fight_club.round_seconds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Length of one Fight Club round in seconds.
  force_all_start:
    read_by: [menu]
    reload: live
    note: >-
      Whether a force start pulls every connected controller into the game, not only the ready ones;
      evaluated at force start.
  invincibility_seconds:
    read_by: [menu]
    reload: per-game
    note: >-
      Invincibility after a round or match start in Tournament and Fight Club. Only real games read
      it (UC-043 BR-009).
  max_concurrent_games:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Cap on games running at once, real and shadow together; checked at every session admission.
  max_shadow_games:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Cap on shadow games running at once; checked at every session admission.
  nonstop.respawn_seconds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Non-Stop Joust: seconds before a dead player respawns.
  nonstop.scoring:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Non-Stop Joust points: `base` per kill and `death_penalty` per death.
  nonstop.spawn_protection_seconds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Non-Stop Joust: seconds a respawned player cannot die.
  nonstop.time_limit_seconds:
    read_by: [menu]
    reload: per-game
    note: >-
      Non-Stop Joust time limit, default 180 s so a round ends by itself (UC-026 BR-006); `0` =
      unlimited. Only real games read it; shadow games use a fixed config, so it is not
      experimentable (UC-043 BR-009). The operator pad sets it (UC-016 BR-012).
  num_teams:
    read_by: [menu]
    reload: per-game
    note: >-
      Number of teams in team modes, sent in the game's start config.
  random_assignment:
    read_by: [menu]
    reload: per-game
    note: >-
      Whether team modes assign players to teams at random; not settable from the operator pad.
  sensitivity:
    read_by: [menu, agent]
    reload: per-game
    note: >-
      Death-threshold level `0` (most forgiving) to `4` for every player of the next game, sent in
      the game's start config; targeting by game mode. The agent reads it for an experiment arm's
      shadow game.
  shadow_policy:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Whether the coordinator admits shadow (agent-started) games alongside real ones; checked at
      every session admission. Only a baseline edit may set `allow`; a stack overlay may only set
      `block`.
  shield.activation:
    read_by: [game-coordinator]
    reload: live
    note: >-
      How a granted shield starts: at once, as a charge fired by the trigger, or held from an energy
      budget (UC-048 BR-004). `trigger` and `hold` apply in Free-for-All only; other modes, shadow
      games and malformed values give `instant`. `hold` is latched per game (BR-011). The agent learns
      of a held charge from `game_player_shield_gate{stat="charged"}` (UC-048 A4).
  shield.charge_expiry_seconds:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Seconds a shield charge is held before it expires, `0` = never; fixed per charge at grant.
      Malformed or negative gives 20; clamped to 0 to 120.
  shield.charge_pre_expiry_seconds:
    read_by: [controller-manager]
    reload: live
    note: >-
      A double pulse plays this many seconds before a charge expires, `0` = none; fixed per charge
      (UC-048 BR-006). Malformed or negative gives 3; clamped to 0 to 8, so a charge that never
      expires gets no early pulse.
  shield.charge_reminder_seconds:
    read_by: [controller-manager]
    reload: live
    note: >-
      One reminder pulse every this many seconds while a charge is held, `0` = none; fixed per
      charge (UC-048 BR-006). Malformed or negative gives 5; other values clamped to 1 to 30.
  shield.charge_rumble_intensity:
    read_by: [controller-manager, game-coordinator]
    reload: live
    note: >-
      Rumble strength of every charge pulse (grant, reminder, pre-expiry), fixed per charge; `0`
      turns the charge rumble off (UC-048 BR-006). Non-integer gives 255; clamped to 0 to 255. In a
      hold game the coordinator's latched value wins.
  shield.charge_rumble_pulse_ms:
    read_by: [controller-manager, game-coordinator]
    reload: live
    note: >-
      Length of one charge pulse in ms, gaps fixed at 100 ms; fixed per charge (UC-048 BR-006).
      Non-integer gives 150; clamped to 50 to 500. In a hold game the coordinator's latched value
      wins.
  shield.empty_pulse_ms:
    read_by: [game-coordinator, controller-manager]
    reload: per-game
    note: >-
      Length of the single "empty" pulse when a hold activation ends because energy or budget ran
      out (UC-048 BR-010). Non-integer gives 400; clamped to 100 to 800.
  shield.end_grace_seconds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Seconds after a shield ends in which movement cannot kill, in every mode (UC-048 BR-015); not
      after a voluntary release. `0` = none. Malformed or negative gives 0.75; clamped to 0 to 2.
  shield.ending_rumble_seconds:
    read_by: [controller-manager, game-coordinator]
    reload: live
    note: >-
      The "ending soon" double pulse plays this many seconds before an active shield ends, `0` =
      none; fixed per shield (UC-048 BR-006). Malformed or negative gives 1; clamped to 0 to 3. In a
      hold game the coordinator's latched value wins.
  shield.energy_budget_seconds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Total active shield time per player per game in hold mode, summed over every activation
      (UC-048 BR-008). Malformed gives 15; clamped to 3 to 30 (`0` does not mean unlimited).
  shield.energy_initial_seconds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Shield energy each player starts with in hold mode, clamped to the cap and the budget (UC-048
      BR-008). Malformed gives 0; clamped to 0 to 5.
  shield.energy_max_seconds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Cap on a player's shield energy in hold mode (UC-048 BR-008); read only when
      `shield.activation` is `hold` in a Free-for-All real game. Malformed gives 5; clamped to 1 to
      10.
  shield.hold_led_floor_percent:
    read_by: [game-coordinator, controller-manager]
    reload: per-game
    note: >-
      White LED brightness in percent a hold activation dims to as its last second starts; `100` =
      no dimming. Never below 10, so the LED never looks dead. Non-integer gives 20; clamped to 10
      to 100.
  shield.hold_rumble_intensity:
    read_by: [game-coordinator, controller-manager]
    reload: per-game
    note: >-
      Continuous rumble while a hold activation runs, and the start of the ramp in ramp mode; `0` =
      none, also no ramp (UC-048 BR-010). Non-integer gives 70; clamped to 0 to 150.
  shield.hold_rumble_max_intensity:
    read_by: [game-coordinator, controller-manager]
    reload: per-game
    note: >-
      Rumble a hold activation ramps up to as its energy drains; kept below the death rumble (255).
      Non-integer gives 200; clamped to 0 to 230. At or below `shield.hold_rumble_intensity` (or
      with it at `0`) the rumble stays flat and the ending and empty pulses play; in ramp mode they
      do not.
  shield.min_burst_seconds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Minimum energy cost of one hold activation, also its debounce tail (UC-030 BR-008, UC-048
      BR-008). Malformed gives 0.3; clamped to 0.1 to 1.
  shield.recharge_per_second:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Passive hold-mode recharge in energy seconds per second while no activation runs (UC-048 A10,
      BR-009). Malformed gives 0; clamped to 0 to 0.5.
  tempo.ramp_down_seconds:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Seconds for a full 1 to 0 music-intensity swing; read at each ramp start, same validation as
      `tempo.ramp_up_seconds`.
  tempo.ramp_up_seconds:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Seconds for a full 0 to 1 music-intensity swing (UC-031 BR-005). Read at each ramp start, so a
      ramp in flight keeps its duration. A non-number or a value <= 0 gives the default; otherwise
      clamped to 0.1 to 10 s.
  thresholds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Base motion death thresholds (warning and max, for slow and fast music) that `sensitivity` and
      per-player factors scale; validated at game start.
  tournament.match_seconds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Length of one Tournament match in seconds.
  tournament.time_between_matches_seconds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Pause between Tournament matches in seconds.
  traitor.count_tiers:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Traitor count by player count (`tiers`, then `fallback_divisor`); capped at (n-1)//2, so 0
      traitors below 3 players and at least 1 from 3.
  werewolf.reveal_time_seconds:
    read_by: [menu]
    reload: per-game
    note: >-
      Seconds into a Werewolf game before the werewolves are revealed. Only real games read it
      (UC-043 BR-009).
  werewolf.thresholds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Werewolf mode's own motion warning and death thresholds.
  werewolf.werewolf_fraction:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Share of Werewolf players who become werewolves.
  windows:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Music tempo windows in seconds (fast and slow phase lengths, and their end-game variants),
      validated at game start. The `pacing_profile` intervention fetches a preset by name live; an
      experiment-arm value blocks it as `experiment_override` (UC-043 BR-005).
  winner_rainbow_duration_ms:
    read_by: [game-coordinator, controller-manager]
    reload: event-refreshed
    note: >-
      How long the winners' rainbow LED effect plays after a game ends.
  zombie.initial_count:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Number of players who start a Zombie game as zombies.
  zombie.respawn_max_seconds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Zombie: upper bound of the random respawn delay in seconds.
  zombie.respawn_min_seconds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Zombie: lower bound of the random respawn delay in seconds.
  zombie.thresholds:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Zombie mode's own motion warning and death thresholds.

interventions:
  audio_cue:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Event list; each event (payload `sound`) plays that sound once (UC-040 BR-006).
  auto_rubberband:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Automatic catch-up help for players who fall behind, `gentle` or `strong`.
  controller_effect:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Event list; each event plays a controller effect once on one player, or on all when `serial`
      is empty.
  eliminate_player:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Event list; each event (payload `serial`) eliminates that player once (UC-040 BR-006).
  end_game:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Event list; an event force-ends only the game whose list holds it (UC-040 BR-011).
  global_difficulty_factor:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Difficulty multiplier for the whole game; below 1.0 is easier.
  global_sensitivity_override:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Sensitivity level for every player of the game, 0 (ultra slow) to 4 (ultra fast); `none` (-1)
      means no override.
  group_shield:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Event list; each event shields 2 to 6 players of the game for the given seconds (UC-048 A13,
      A14, BR-014). Only the `standard_group` variant of
      `agent/interventions_allowed` allows it.
  music_tempo_override:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Music tempo multiplier for the game; `none` (0) means no override.
  pacing_profile:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Switches the game's music windows to the named preset of `game/windows`. In an
      experimental-arm game whose experiment sets `windows` to another value it is blocked
      `experiment_override` (UC-043 BR-005).
  player_handicap_factor:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Per-player handicap multiplier; above 1.0 helps the player, below 1.0 reins them in. A level
      back at neutral resets the player to 1.0 (UC-040 BR-017).
  player_sensitivity_factor:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Per-player sensitivity multiplier; below 1.0 protects, above 1.0 handicaps. A level back at
      neutral resets the player to 1.0 (UC-040 BR-017).
  revive_player:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Event list; each event (payload `serial`) revives that player once (UC-040 BR-006).
  shield_seconds:
    read_by: [agent, game-coordinator]
    reload: live
    note: >-
      Shield grant length in seconds for one player. The agent takes the value of the variant named
      `default` as the length of a `grant_shield` without a value; a failed read, missing variant or
      value outside 3 to 10 gives 5 (UC-048 BR-012).
  soft_penalty_action:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Soft penalty grant for one player: `warn`, `tighten`, or `tighten:<seconds>:<factor>`.
  tempo_ramp:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Tempo ramp as `<target 1.0 to 1.3>:<seconds>:<linear or ease>`; the coordinator caps the curve
      at 15 s.
  toughness_boost_seconds:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Toughness boost grant for one player, as `<seconds>:<factor>` (`0` = none).
  volume_override:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Game volume override; `none` (-1) means no override.

controller:
  backend:
    read_by: [controller-manager]
    reload: startup
    note: >-
      I/O backend of the controller manager; a change needs a restart. `mock` is always added, and
      an unreadable flag gives `rust`.
  poll_drop_threshold:
    read_by: [game-coordinator]
    reload: event-refreshed
    note: >-
      Number of dropped controller polls the game coordinator tolerates; `off` (0) disables the
      check.
  rust_hid.output_rate_hz:
    read_by: [rust-hid]
    reload: live
    note: >-
      Cap on output writes per controller per second (UC-002 BR-005); a rumble change also takes a
      write slot. 20 is used until the set syncs, and 0 or negative is ignored. At 20, flash phases
      can merge slightly.
  silent_disconnect_seconds:
    read_by: [controller-manager]
    reload: live
    note: >-
      A controller with no fresh report for this many seconds counts as disconnected and
      re-registers on its next report (UC-002 BR-007). Invalid or unreadable gives 3, otherwise
      clamped to 1 to 10. Human-only (C-034).

operator:
  operator_pad.device:
    read_by: [operator-pad]
    reload: live
    note: >-
      USB `vendor:product` id (hex) of the pad; empty matches no device. Read at the next rescan.
  operator_pad.display_autopage_ms:
    read_by: [operator-pad]
    reload: live
    note: >-
      Time before the pages turn on their own (UC-016 BR-009); 0 keeps the page. Outside 0 or 1000
      to 60000, or malformed, gives 5000 with a warning.
  operator_pad.display_enabled:
    read_by: [operator-pad]
    reload: live
    note: >-
      Pad display link; off closes it, the pad shows `NO HOST` and keeps UC-015 behaviour (UC-016
      A1). Unreadable keeps it on.
  operator_pad.display_home_ms:
    read_by: [operator-pad]
    reload: live
    note: >-
      Time after the last key or knob input before the display returns Home (UC-016 BR-009); outside
      2000 to 120000 or malformed gives 10000 with a warning.
  operator_pad.display_poll_ms:
    read_by: [operator-pad]
    reload: live
    note: >-
      Display refresh interval (UC-016 BR-003, NFR-070); outside 200 to 5000 or malformed gives 500
      with a warning.
  operator_pad.display_result_ms:
    read_by: [operator-pad]
    reload: live
    note: >-
      How long a result, tap or volume shows (UC-016 BR-001); outside 300 to 10000 or malformed
      gives 1500 with a warning.
  operator_pad.enabled:
    read_by: [operator-pad]
    reload: live
    note: >-
      Turns the operator pad (UC-015) on or off.
  operator_pad.hold_agent_ms:
    read_by: [operator-pad]
    reload: live
    note: >-
      K5 hold time that stops or resumes the agent (UC-016 BR-011); must exceed
      `operator_pad.tap_ms`.
  operator_pad.hold_end_ms:
    read_by: [operator-pad]
    reload: live
    note: >-
      K8 hold time that ends or force-starts a game (UC-016 BR-011); must exceed
      `operator_pad.tap_ms`, and plus 150 ms stay below `operator_pad.hold_lock_ms`.
  operator_pad.hold_lock_ms:
    read_by: [operator-pad]
    reload: live
    note: >-
      K4 hold time that locks or unlocks the pad, and the end of the K8 window (UC-016 BR-015); must
      be at least 1500 ms above `operator_pad.hold_reset_ms`.
  operator_pad.hold_reset_ms:
    read_by: [operator-pad]
    reload: live
    note: >-
      Hold of a reset key before the reset screen (UC-016 BR-013, BR-015). Timings are checked
      together per key press; a broken rule keeps all default timings with a warning (UC-015
      BR-007).
  operator_pad.internet_check_ms:
    read_by: [operator-pad]
    reload: live
    note: >-
      Time between two internet checks (UC-016 BR-010); outside 5000 to 300000 or malformed gives
      30000 with a warning.
  operator_pad.internet_check_target:
    read_by: [operator-pad]
    reload: live
    note: >-
      `host:port` of the internet check's TCP connect (UC-016 BR-010); empty runs no check. A failed
      read or malformed value keeps the last good value with a warning.
  operator_pad.keymap:
    read_by: [operator-pad]
    reload: live
    note: >-
      Maps pad keys and knob to the F13 to F23 key codes the pad sends; read at the next rescan.
  operator_pad.knob_events_per_step:
    read_by: [operator-pad]
    reload: live
    note: >-
      Raw knob events per setting step; outside 1 to 12 or malformed gives 1 with a warning.
  operator_pad.preview_debounce_ms:
    read_by: [operator-pad]
    reload: live
    note: >-
      Wait after the last knob step before the preview speaks (UC-015 BR-017); outside 0 to 1000 or
      malformed gives 150 with a warning.
  operator_pad.preview_enabled:
    read_by: [operator-pad]
    reload: live
    note: >-
      Spoken live preview while a layer key is held and the knob turns (UC-015 BR-017); unreadable
      keeps it on.
  operator_pad.tap_ms:
    read_by: [operator-pad]
    reload: live
    note: >-
      Tap limit (UC-015 BR-007); must be below every hold time, or the pad keeps all default timings
      with a warning.

system:
  game_loop.update_frequency_hz:
    read_by: [controller-manager, game-coordinator]
    reload: event-refreshed
    note: >-
      Rate of the game loop and gameplay stream. A non-positive, non-finite or non-numeric value
      keeps the previous value (initially 60); otherwise clamped to 1 to 100.
  idle.enabled:
    read_by: [menu]
    reload: live
    note: >-
      Lobby idle monitor on or off.
  idle.timeout_minutes:
    read_by: [menu]
    reload: live
    note: >-
      Minutes without activity before the lobby goes idle.
  pairing.bluez_restart_mode:
    read_by: [pairing-daemon]
    reload: live
    note: >-
      When bluetoothd is restarted after a pairing. An unknown value or unreachable flagd gives
      `never`.
  pairing.bt_monitor_interval:
    read_by: [pairing-daemon]
    reload: live
    note: >-
      Seconds between Bluetooth monitor checks.
  pairing.poll_interval:
    read_by: [pairing-daemon]
    reload: live
    note: >-
      Seconds between USB pairing polls.
  pairing.restart_quiet_period:
    read_by: [pairing-daemon]
    reload: live
    note: >-
      Seconds with no PS Move waiting on USB and no pairing before a `when_idle` restart (UC-001
      BR-005); a Move already paired and left on USB does not count. 0 restarts at the end of the
      poll; negative or unreadable gives 20.
  sentinel.breath_period_seconds:
    read_by: [menu]
    reload: live
    note: >-
      Length of one sentinel breathing cycle; read when an animation starts.
  sentinel.count:
    read_by: [menu]
    reload: live
    note: >-
      Number of controllers that show the idle sentinel animation.
  sentinel.hue_period_seconds:
    read_by: [menu]
    reload: live
    note: >-
      Time for the sentinel colour to go round the hue circle once; read when an animation starts.
  sentinel.max_brightness:
    read_by: [menu]
    reload: live
    note: >-
      Highest brightness (0 to 1) of the sentinel breathing; read when an animation starts.
  sentinel.min_brightness:
    read_by: [menu]
    reload: live
    note: >-
      Lowest brightness (0 to 1) of the sentinel breathing; read when an animation starts.
  sentinel.rotation_minutes:
    read_by: [menu]
    reload: live
    note: >-
      Minutes before the sentinel role moves to other controllers; `off` (0) keeps them.
  sentinel.update_hz:
    read_by: [menu]
    reload: live
    note: >-
      Update rate of the sentinel animation; read when an animation starts.

user:
  agent_intervention_cue:
    read_by: [game-coordinator]
    reload: live
    note: >-
      Controller LED cue when the agent intervenes on a player; read per cue.
  audio_volume.countdown_music:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Volume of the countdown music before a game.
  audio_volume.game:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Volume of in-game sounds and music.
  audio_volume.lobby_music:
    read_by: [menu]
    reload: startup
    note: >-
      Volume of the lobby music; a change needs a menu restart.
  audio_volume.master:
    read_by: [audio]
    reload: live
    note: >-
      Master volume, multiplied by the operator gain; an effective 0 plays nothing. `mute` is the
      operator pad's mute (UC-015 BR-006). An unreadable flag keeps the last value (1.0 before the
      first read).
  audio_volume.menu_sound:
    read_by: [menu]
    reload: startup
    note: >-
      Volume of menu sound effects; a change needs a menu restart.
  audio_volume.menu_voice:
    read_by: [menu]
    reload: startup
    note: >-
      Volume of the menu announcer voice; a change needs a menu restart.
  current_game:
    read_by: [menu]
    reload: live
    note: >-
      The game mode selected in the menu, kept across restarts; read at each menu start.
  game_instructions:
    read_by: [game-coordinator]
    reload: per-game
    note: >-
      Spoken instructions at game start (UC-020 A5); fails closed to off.
  menu_auto_start:
    read_by: [menu]
    reload: startup
    note: >-
      Whether the menu starts on its own when the service starts; a change needs a restart.
  menu_voice:
    read_by: [audio, menu]
    reload: event-refreshed
    note: >-
      Voice profile of the menu announcer. An unknown value keeps the current voice (UC-031 A4); a
      line one profile lacks plays from the other (UC-031 BR-007).
  play_audio:
    read_by: [audio]
    reload: live
    note: >-
      Audio on or off; re-read at each sound or music start. Turning it on opens the audio hardware
      at runtime (UC-031 A1).

observability:
  debug:
    read_by: [pairing-daemon]
    reload: live
    note: >-
      Pairing daemon debug mode: tracebacks on logged errors and log level DEBUG.
  flagservice.propagation_probe:
    read_by: []
    reload: none
    note: >-
      Probe value for measuring write-to-serve propagation (NFR-050); no service reads it.
  grpc_rpc_spans:
    read_by: [lib, rust-hid]
    reload: live
    note: >-
      A tracing span per gRPC call in the Python gRPC services and rust-hid; read per call.
  log_level:
    read_by: [agent, lib]
    reload: live
    note: >-
      Log level of the Python services and the agent. The `LOG_LEVEL` env var only sets the level
      until the flag resolves (and the agent's level on sync loss); the flag service itself keeps
      `LOG_LEVEL`.
  metrics_export_interval_ms:
    read_by: [lib]
    reload: startup
    note: >-
      OpenTelemetry metrics export interval of every Python service; targetable per `service`. A
      change needs a restart.
  otel_bsp_schedule_delay_millis:
    read_by: [lib]
    reload: startup
    note: >-
      Span batch export delay of every Python service; targetable per `service`. A change needs a
      restart.
  telemetry.moment_shape:
    read_by: [lib]
    reload: per-game
    note: >-
      How game moments (warning, death, intervention) are recorded, read by the game coordinator per
      game through `lib/moments.py` and held for the game (UC-100 BR-002). An unknown value reads as `span_event`; reset it after the booth (UC-100 step 9). It
      never changes what the agent reads (UC-041 BR-009).
