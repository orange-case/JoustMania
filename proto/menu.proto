syntax = "proto3";

package joustmania.menu;

option go_package = "github.com/joustmania/connect-proxy/gen/menu";

// Menu Service - Manages menu UI and user interactions
service MenuService {
  // Start menu
  rpc StartMenu(StartMenuRequest) returns (StartMenuResponse);

  // Stop menu
  rpc StopMenu(StopMenuRequest) returns (StopMenuResponse);

  // Stream menu events (button presses, selections)
  rpc StreamMenuEvents(StreamMenuEventsRequest) returns (stream MenuEvent);

  // Process menu input
  rpc ProcessInput(ProcessInputRequest) returns (ProcessInputResponse);

  // List the playable game modes (what the dashboard mode selector offers)
  rpc ListGameModes(ListGameModesRequest) returns (ListGameModesResponse);

  // Read-only menu snapshot for the operator pad (#2050, UC-015, services.md §3.1)
  rpc GetMenuStatus(GetMenuStatusRequest) returns (GetMenuStatusResponse);
}

// Menu state
enum MenuState {
  STOPPED = 0;
  RUNNING = 1;
  GAME_STARTING = 2;
}

// Request/Response messages
message StartMenuRequest {}

message StartMenuResponse {
  bool success = 1;
  string error = 2;
}

message StopMenuRequest {}

message StopMenuResponse {
  bool success = 1;
  string error = 2;
}

message StreamMenuEventsRequest {}

message MenuEvent {
  string event_type = 1;  // "selection_changed", "game_requested"
  map<string, string> data = 2;  // Event-specific data
  int64 timestamp = 3;  // Unix timestamp in milliseconds
}

message ProcessInputRequest {
  string input_type = 1;  // "button_press", "web_command", etc.
  map<string, string> data = 2;
}

message ProcessInputResponse {
  bool success = 1;
  string error = 2;
  // Operator pad step_setting / set_backend / reset_setting / agent_state (services.md §3.1): the value
  // the menu committed (or a reset put in force), as a variant, mode or backend name ("fast", "automatic",
  // "JoustFFA", "claude", "on"); empty on an error and for every other input. The pad's result screen shows it
  // (UC-016 BR-001).
  string value = 3;
}

message ListGameModesRequest {}

message ListGameModesResponse {
  repeated string game_modes = 1;  // Games enum names of the implemented modes, in menu cycle order
  string default_mode = 2;         // Mode a client preselects ("JoustFFA")
}

message GetMenuStatusRequest {}

// Read from menu memory and the in-process flag clients, never from the HTTP flag writer.
message GetMenuStatusResponse {
  MenuState menu_state = 1;
  bool lifecycle_live = 2;          // the game lifecycle task is live (starting, running, restoring the lobby)
  int64 lifecycle_generation = 3;   // goes up when the lifecycle starts and when it ends (UC-015 A5)
  string selection = 4;             // Games enum name of the selected mode
  int32 ready_count = 5;
  int32 connected_count = 6;
  reserved 7;
  reserved "admin_serial";
  bool agent_enabled = 8;           // agent/enabled is `watch` or `act` (the agent runs)
  string agent_level = 9;           // agent/interventions_allowed variant name
  string agent_saved_level = 10;    // unused since #2800 (no level is saved at a stop), always empty
  string agent_backend = 11;        // agent/decision.backend variant name
  int32 sensitivity = 12;           // game/sensitivity (0-4)
  int32 num_teams = 13;             // game/num_teams
  bool instructions = 14;           // user/game_instructions
  bool force_all_start = 15;        // game/force_all_start
  string audio_volume_master = 16;  // user/audio_volume.master variant name
  string agent_enabled_state = 17;  // agent/enabled: "off", "watch", "act" or "unknown" (unresolvable; UC-015 BR-013, #2101)
  string agent_interventions_enabled_state = 18;  // unused since #2846 (the write gate is gone), always empty
  string shield_activation = 19;   // game/shield.activation variant name, empty when unresolvable (UC-015 BR-018, #2215)
  reserved 20;  // was shield_activation_operator (#2218), folded into operator_settings
  // Per setting with an "automatic" rung (sensitivity, num_teams, shield.activation): the operator's persisted
  // value as a variant name, or "automatic" when none is set (the flag file's default applies). A missing key =
  // unknown (not read yet or unreadable). UC-015 BR-018, #2222.
  map<string, string> operator_settings = 21;
  // The agent rows of the pad's pages (UC-016 BR-006, BR-012; #2742, #2755); empty = unknown. Each in its
  // canonical format (services.md §3.1), the one `from`, `expect`, setting_defaults and the committed value use.
  string agent_objectives = 22;                    // agent/objectives variant name (base value, empty context)
  string agent_max_interventions_per_minute = 23;  // policy.max_interventions_per_minute as an integer decimal
  string agent_group_grant_state = 24;             // policy.group_grant.enabled: "on" or "off"
  string inference_backend = 25;                   // inference.backend variant name
  string inference_effort = 26;                    // inference.effort variant name
  // decision.operator_brief: "off" (empty), the preset whose text equals it byte for byte, else "custom";
  // never the text. From the background flag-service read.
  string agent_operator_brief_variant = 27;
  // Per resettable option without an "automatic" rung (game_instructions, force_all_start, agent_level,
  // decision.backend, and the agent rows of fields 22 to 27 by option name): what a reset_setting would put in
  // force. A missing key = unknown, never "". From the background flag-service
  // read, never read in the call. UC-016 BR-013, #2747, #2755.
  map<string, string> setting_defaults = 28;
  // Pad commands and guard keys this menu understands ("reset_setting", "agent_state",
  // "step_setting.from", "set_backend.from", "step_setting:<option>",
  // "reset_setting:<option>"); empty = a menu older than the field. #2747, #2755.
  repeated string pad_commands = 29;
  // Connected controllers (any state) whose battery is 20 % or less on the battery_to_pct scale. Absent = a menu
  // older than the field (unknown); 0 is a real count. UC-002 A8, BR-010; UC-016 BR-006.
  optional int32 low_battery_count = 30;
}
